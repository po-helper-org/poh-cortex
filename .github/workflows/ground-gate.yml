name: Память

on: [push, pull_request]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Ни pip install, ни сервисов: инструмент живёт на стандартной библиотеке.
      - name: Гейт памяти
        run: bin/cortex gate

      # Вычисляемые поля должны быть пересчитаны до коммита, а не в CI.
      - name: Свежесть пересчитана
        run: bin/cortex refresh --dry-run

      # Срез — производный артефакт: он не должен отставать от памяти.
      - name: Срезы профилей пересобраны
        run: |
          bin/cortex pack --all
          git diff --exit-code --stat GROUND/_index/packs/ \
            || { echo "::error::срезы устарели — выполните bin/cortex pack --all и закоммитьте"; exit 1; }

      - name: Дымовой тест инструмента
        run: tests/smoke.sh

      # Дымовой тест отвечает «команды не падают». Приёмка — «гарантии держат»:
      # источник обязателен, ступень не растёт рассуждением, протухшее теряет
      # уверенность само, обещание не идёт выше слабого звена.
      - name: Приёмка гарантий
        run: tests/acceptance.sh

      - name: Отчёт
        run: bin/cortex report
