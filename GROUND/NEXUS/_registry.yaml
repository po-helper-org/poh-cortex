# Реестр Нексусов. Источник истины для поля `nexus` и для типов узлов:
# node_types объявляются здесь, а не захардкожены в инструменте — поэтому
# новый объект управления заводится декларацией, а не правкой кода.
#
# scope   — чей это объект: org (общий на организацию) | team:<имя> | product:<имя>.
#           Общие Нексусы (IT-ландшафт, орг.структура, операционная модель) —
#           org. Стратегия и эксперименты — по команде.
# shared  — можно ли писать сюда из другой зоны.
# change_rate — как быстро устаревает знание этого объекта (SCHEMA/profiles.yaml).

version: 2

nexus_types:
  # --- минимальный набор PAF ---
  - {slug: product,  source: default, name: Нексус продукта, scope: org, shared: true, owner: Product Engineer, change_rate: medium, node_types: [product, feature, value-proposition, service, interface, platform], purpose: "идея, фичи, Видение, гэп до Видения", onboarded: todo}
  - {slug: customer, source: default, name: Нексус потребителя, scope: org, shared: true, owner: Product Engineer, change_rate: medium, node_types: [segment, need], purpose: "сегменты, работы, боли, гипотеза mNSM", onboarded: todo}
  - {slug: market,   source: default, name: Нексус рынка, scope: org, shared: true, owner: Portfolio Manager, change_rate: medium, node_types: [entity, concept], purpose: "объём и динамика рынка, тренды, конкуренты", onboarded: todo}
  - {slug: growth,   source: default, name: Нексус системы роста, scope: org, shared: true, owner: Growth Engineer, change_rate: high, node_types: [entity, concept, experiment], purpose: "каналы, монетизация, рычаги роста", onboarded: todo}

  # --- операционные, общие на департамент ---
  - {slug: ops-model, source: default, name: Нексус операционной модели, scope: org, shared: true, owner: Product Ops, change_rate: low, node_types: [operating-model, process, standard], purpose: "правила игры: принципы, границы делегирования, протокол памяти", onboarded: partial}
  - {slug: team,      source: default, name: Организационная структура, scope: org, shared: true, owner: Product Ops, change_rate: low, node_types: [person], purpose: "кто владелец чего, кто кому подчиняется, к кому идти", onboarded: todo}
  - {slug: company,   source: default, name: Портфель организации, scope: org, shared: true, owner: Portfolio Manager, change_rate: low, node_types: [entity, product], purpose: "портфель продуктов и бизнес-юнитов", onboarded: todo}

  # --- объекты решений корпоративного PO: расскомментируйте нужные ---
  # Заводите Нексус тогда, когда из-за незнания объекта вы уже приняли плохое
  # решение. Восемь Нексусов на старте — это справочник вместо управления.
  #
  # - {slug: landscape,   source: custom, name: IT-ландшафт, scope: org, shared: true, owner: Product Ops, change_rate: high, node_types: [system-component, integration], purpose: "системы, контракты, SLA, версии схем — можно ли обещать срок по интеграции"}
  # - {slug: dependencies, source: custom, name: Внешние зависимости, scope: org, shared: true, owner: Product Engineer, change_rate: high, node_types: [dependency], purpose: "владельцы, каналы, обещания, латентность ответа"}
  # - {slug: processes,   source: custom, name: Бизнес-процессы, scope: org, shared: true, owner: Product Ops, change_rate: medium, node_types: [process], purpose: "как реально проходит заказ, оплата, возврат, поддержка"}
  # - {slug: experiments, source: custom, name: Результаты экспериментов, scope: "team:<имя>", shared: false, owner: Product Engineer, change_rate: low, node_types: [experiment, precedent], purpose: "что пробовали, что вышло, где лестница врала"}
  # - {slug: strategy,    source: custom, name: Стратегия и ставки, scope: "team:<имя>", shared: false, owner: Product Engineer, change_rate: medium, node_types: [objective, key-result, decision], purpose: "цели, ставки, приоритеты и история их изменений"}
