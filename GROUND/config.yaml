# Контекст вашей организации. Заполните этот файл первым: cortex init
# Плейсхолдеры в < > обязательны к замене.

company: "<НАЗВАНИЕ ОРГАНИЗАЦИИ>"

product:
  name: "<НАЗВАНИЕ ПРОДУКТА>"
  slug: your-product            # ascii-slug: [a-z0-9][a-z0-9-]*
  idea: >
    <ИДЕЯ ПРОДУКТА в 1–2 предложениях: кому и какую ценность несёт.>

team:
  size: 1
  # roster — источник истины по ролям. Значение: имя человека,
  # "Cortex" (роль делегирована агенту) или null (роли нет).
  roster:
    product_engineer: "<ФИО продуктового инженера>"   # обязателен
    product_ops: Cortex
    growth_engineer: null
    portfolio_manager: null

# Зона по умолчанию для узлов, у которых scope не задан явно.
# В корпоративной структуре с несколькими PO это разделяет память:
# org — общее, team:<имя> и product:<имя> — своё.
scope:
  default: org
  mine: org

# Уровень зрелости: 0 локальная папка · 1 приватный репозиторий ·
# 2 CI считает и блокирует merge · 3 автоприём потока из мессенджеров.
# Уровень определяется числом людей, пишущих в память, а не амбицией.
maturity_level: 0

# Жёсткость проверок гейта: error | warn | off.
# Настраивается под контур сознательно, а не чтобы убрать красное.
gate:
  registry_drift: error       # папка Нексуса, не объявленная в реестре
  unknown_node_type: error    # тип узла, не объявленный нигде
  ripeness_drift: warn        # вычисляемое поле разошлось — нужен cortex refresh
  unknown_agent: warn         # captured_by вне SCHEMA/agents.yaml
  missing_provenance: warn    # узел без captured_by

onboarding:
  status: init                # init | in_progress | done
  sources_ingested: []
  onboarded_at: null

created: 2026-01-01
