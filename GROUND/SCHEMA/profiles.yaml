# Распад знания. Срок годности выводится из того, как часто объект менялся,
# а не из типа Нексуса. Данных нет — high, не среднее: завысили — заплатили
# перепроверкой, занизили — получили протухшее знание и сорванный квартал.

version: 2

change_rate:
  high:    {ttl_days: 21,  when: "менялось чаще раза в месяц; узнаю постфактум"}
  medium:  {ttl_days: 42,  when: "менялось раз в квартал"}
  low:     {ttl_days: 90,  when: "договоры, юридические основания, стабильные контракты"}
  unknown: {ttl_days: 21,  when: "данных нет ни у меня, ни у владельца — трактуется как high"}

# Запасной вариант, когда change_rate у узла не задан.
ttl_by_nexus:
  _default:  90
  ops-model: 365
  team:      180
  company:   180
  growth:    60

# Увядание снимает ступени: протухший узел теряет CP сам, без ручного прохода.
decay:
  steps_per_ttl: 2.0   # сколько ступеней теряется за один просроченный ttl
  floor: 2             # ниже второй ступени распад не опускает
