# Жёсткость проверок памяти: error | warn | off.
#
# Это правило измерения, а не настройка удобства, поэтому оно живёт здесь,
# рядом с лестницей и профилями распада, а не в config.yaml с названием
# организации. Тот, кто может перевести проверку в off, может получить зелёный
# гейт при сломанной памяти — ровно так же, как правка лестницы даёт любое
# число. Поэтому каталог SCHEMA/ закрыт для агентов (SCHEMA/agents.yaml)
# и ревьюится человеком (.github/CODEOWNERS).
#
# Ослабление проверки — осознанное решение человека о своём контуре,
# зафиксированное в истории репозитория, а не способ убрать красное.

version: 2

checks:
  registry_drift: error       # папка Нексуса с узлами, не объявленная в реестре
  unknown_node_type: error    # тип узла, не объявленный ни в схеме, ни в реестре
  ripeness_drift: warn        # вычисляемое поле разошлось — нужен cortex refresh
  unknown_agent: warn         # captured_by вне SCHEMA/agents.yaml
  missing_provenance: warn    # узел без captured_by: не видно, кто записал
  agent_zone_drift: warn      # зона агента ссылается на несуществующий Нексус
  weakest_link_drift: error   # CP ставки выше слабейшей из её зависимостей
