# Лестница доказательств. CP не назначается мнением — он считывается отсюда
# по одному вопросу: какой самый сильный артефакт существует и открывается
# по ссылке. Нет артефакта — нет ступени.
#
# Каркас ступеней фиксирован. Формулировки калибруются под ваш домен один раз
# за квартал и до Harvesting не меняются: тот, кто меняет линейку по ходу,
# может получить любое число.

version: 2

steps:
  2: {frame: "кто-то сказал",                                         yours: ""}
  3: {frame: "кто-то написал: владелец, с датой и объёмом",           yours: ""}
  4: {frame: "показали работающим на демо",                           yours: ""}
  5: {frame: "проверили в искусственных условиях",                    yours: ""}
  6: {frame: "проверили против реальной системы или реального человека", yours: ""}
  7: {frame: "прошло на ограниченном реальном объёме",                 yours: ""}
  8: {frame: "прошло с деньгами или на реальной нагрузке",             yours: ""}
  9: {frame: "работает в проде постоянно",                             yours: ""}

# Потолки: выше них ступень не поднимается, каким бы убедительным ни был текст.
ceilings:
  channel:
    oral: 3          # созвон, личные сообщения — от этого можно отказаться
    chat: 3
    email: 9         # письмо, тикет, MR, прогон CI — без потолка
    ticket: 9
    ci: 9
  authority:
    not_owner: 2     # пересказ чужих слов — слухи
  observation:
    rare: 5          # вижу команду раз в спринт — не выше пятой
  disputed: 4        # пока два источника расходятся, уверенность не выше четвёртой

rules:
  weakest_link: true   # CP ставки равен минимуму CP её критических зависимостей
  silence_is_not_confirmation: true
  contradiction_lowers: true   # расхождение источников — это и есть неопределённость
  scope_required: true         # «сверка сошлась на 50 транзакциях» — факт про 50
