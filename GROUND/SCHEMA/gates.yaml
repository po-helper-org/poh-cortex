# Гейты: при каком уровне уверенности и к какой дате обещание уходит наружу.
#
# Не путать с `cortex gate` и `checks.yaml` — те про целостность памяти.
# Здесь — гейт из методологии: порог CP плюс дата. Ниже порога обещание
# не даётся; у гейта три исхода, и «подождать» среди них нет:
#
#   убить      — ставка не нужна или неисполнима, снимаем её и освобождаем ёмкость
#   донасытить — порог достижим, нужен конкретный артефакт к конкретной дате
#   дать дату  — порог взят, обещание уходит наружу
#
# Это единственное правило измерения, которое калибруется не в одиночку:
# «что считается обещанием наружу» знает руководитель, а не только PO.
# Пятнадцать минут разговора с ним — и дальше не меняется до конца квартала.

version: 1

gates:
  # <ключ гейта>:
  #   what:      что за обещание — теми словами, которыми его услышат снаружи
  #   threshold: ступень лестницы, ниже которой обещание не даётся
  #   to:        кому оно уходит: команда · смежник · руководитель · клиент
  #   lead_time: за сколько недель до даты решение принимается, а не сообщается

  plan:
    what: "<план квартала: что берём в обязательства>"
    threshold: <ступень>
    to: <кому>
    lead_time_weeks: <n>

  build:
    what: "<старт разработки по ставке>"
    threshold: <ступень>
    to: <кому>
    lead_time_weeks: <n>

  commit:
    what: "<дата наружу: QBR, смежник, клиент>"
    threshold: <ступень>
    to: <кому>
    lead_time_weeks: <n>

# Правило, которое не обсуждается: гейт проходит ставка, а не настроение.
# Порог взят — дата даётся. Порог не взят — даётся дата проверки, а не срок.
