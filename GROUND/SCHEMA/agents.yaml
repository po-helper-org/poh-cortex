# Реестр агентов и зон записи.
#
# Правило архитектуры, из которого следует всё остальное: уверенность считает
# и в курируемую память пишет только детерминированный агент по правилам из
# SCHEMA. Самообучающиеся агенты (Hermes, шлюзы мессенджеров) собирают и
# готовят — их выход всегда _intake/ и log/, никогда NEXUS/ и DECIDE/bets/.
#
# Причина не в недоверии. Ценность числа уверенности в том, что его нельзя
# подкрутить: одни артефакты по одним правилам дают одно число. Агент, который
# меняет свои навыки по опыту, через месяц начнёт считать иначе, чем
# договорились. Для рутины это достоинство, для расчёта уверенности — дефект.
#
# Гейт сверяет captured_by с зоной: запись мимо зоны — ошибка, а не стиль.

version: 2

classes:
  human:
    may_write: ["**"]
    mode: free
    what: "человек: цели, приоритеты, правила, обещания наружу"

  deterministic:
    may_write: ["GROUND/**", "ROADMAP/**"]
    mode: confirmed          # показывает, что запишет, и ждёт подтверждения
    what: "детерминированный агент: считает CP по лестнице, пишет узлы и ставки"

  curator:
    may_write: ["GROUND/NEXUS/**", "GROUND/PULSE/**"]
    mode: additive           # дополняет, не переписывает курируемый текст
    what: "доменный навык: промоутит разобранное в свой участок памяти"

  collector:
    may_write: ["GROUND/_intake/**", "GROUND/DECIDE/log/**"]
    mode: append             # только добавление, без правки существующего
    what: "сборщик: приносит поток. Знанием поток становится только после разбора"

agents:
  # --- человек ---
  - {id: "po:owner", class: human, scope: org}
  - {id: "curator", class: human, scope: org, what: "куратор ядра: принимает изменения scope org через PR"}

  # --- детерминированный слой ---
  - {id: "cortex", class: deterministic, what: "этот инструмент"}
  - {id: "claude-code", class: deterministic, what: "агент над файлами и git"}

  # --- доменные навыки: зона сужается до их участка ---
  - {id: "skill:paf-onboard",  class: curator}
  - {id: "skill:paf-pulse",    class: curator, may_write: ["GROUND/PULSE/**"]}
  - {id: "skill:radar-promote", class: curator,
     may_write: ["GROUND/NEXUS/problem/**", "GROUND/NEXUS/system/**", "GROUND/NEXUS/ownership/**"]}

  # --- Hermes Agent: боты профиля. Пишут только в очередь ---
  - {id: "hermes:keeper",     class: collector, what: "Хранитель: ссылки, письма, прогоны; кого ждём"}
  - {id: "hermes:sorter",     class: collector, what: "Разборщик: классификация обращений"}
  - {id: "hermes:secretary",  class: collector, what: "Секретарь: контекст к встречам, черновики"}
  - {id: "hermes:observer",   class: collector, what: "Наблюдатель: латентность смежников и тишина"}
  - {id: "hermes:analyst",    class: collector, what: "Аналитик: выгрузки для расчёта ёмкости"}

  # --- шлюз мессенджеров: строго чтение потока в очередь ---
  - {id: "gateway:messengers", class: collector, may_write: ["GROUND/_intake/chats/**"]}

# Чего не делегируется никакому агенту: обещания наружу (даты, сроки, объём),
# изменение правил (лестница, пороги, сроки годности), отправка сообщений от
# имени человека, переговоры о датах и ёмкости, запись в узлы без подтверждения.
never_delegated:
  - "обещания наружу: даты, сроки, объём"
  - "изменение SCHEMA/ladder.yaml и SCHEMA/profiles.yaml"
  - "отправка сообщений во внешние каналы от имени человека"
  - "переговоры о датах, эскалации, торг за ёмкость"
  - "запись в NEXUS и DECIDE без подтверждения человека"

# ──────────────────────────────────────────────────────────────────────────────
# Профили PO. Каждый профиль Hermes — отдельный агент со своей зоной.
#
# Зоны СОЗНАТЕЛЬНО пересекаются: продукт сильносвязный, и одна цель обычно
# требует координации нескольких PO. Поэтому `writes` — список, а не одно
# значение, и запись в общую зону не конфликт, а норма.
#
# Правило записи:
#   зона в `writes` профиля            → пишет напрямую
#   узел с этим профилем в shared_with  → пишет напрямую, владелец узла видит
#   всё остальное (включая scope: org)  → через PR к куратору ядра
#
# subscriptions — что из ядра для профиля горячее: влияет на срез и на то,
# чьё увядание показывается ему как срочное. Это интерес профиля, а не
# свойство узла: одна и та же витрина для одного PO меняется ежедневно,
# для другого — стабильная внешняя система.

profiles:
  - id: po-gds
    name: "PO команды GDS"
    person: "<ФИО>"
    writes: [team:GDS]
    subscriptions: []

  - id: po-live
    name: "PO команды Live"
    person: "<ФИО>"
    writes: [team:Live]
    subscriptions: []

  # Пример пересечения: конверсия витрины и GDS оба пишут про витрину.
  # Зона product:vitrina перечислена у обоих — это не ошибка конфигурации.
  # - {id: po-conversion, name: "PO конверсии витрины", person: "<ФИО>",
  #    writes: ["product:vitrina"], subscriptions: [system-vitrina]}
  # - {id: po-fintech, name: "PO финтеха", person: "<ФИО>",
  #    writes: ["team:fintech"], subscriptions: [system-vitrina]}
  # - {id: po-partners, name: "PO партнёрских продаж", person: "<ФИО>",
  #    writes: ["team:partners"], subscriptions: []}

# Ядро организации: люди, оргструктура, IT-ландшафт, процессы, комплаенс.
# У него один ответственный — он принимает изменения по качеству, день ко дню,
# через PR. Ядро, у которого нет владельца, протухает первым: его увядание
# не попадает ни в чью очередь.
core:
  curator: "<ФИО куратора ядра>"
  scope: org
  review: pull-request
